name: AI PR Review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  models: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest
        env:
          PYTHONPATH: .

      - name: Prepare code for AI review
        run: |
          {
            echo "You are a professional Python code reviewer."
            echo ""
            echo "Review the following Python project files."
            echo "Find bugs, runtime errors, security problems,"
            echo "performance problems and code quality issues."
            echo ""
            echo "Return a concise Markdown review."
            echo "Identify severity as CRITICAL, HIGH, MEDIUM, or LOW."
            echo "Give the overall quality score out of 100."
            echo ""
            echo "================ PROJECT FILES ================"
            find project -name "*.py" -type f -print -exec sh -c 'echo; echo "===== $1 ====="; cat "$1"' _ {} \;
          } > review_prompt.txt

      - name: Run AI reviewer
        id: ai
        uses: actions/ai-inference@v1
        with:
          prompt-file: ./review_prompt.txt
          model: openai/gpt-4o
          max-completion-tokens: 2000
          temperature: 0.1

      - name: Post AI review to PR
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW: ${{ steps.ai.outputs.response }}
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -f body="$REVIEW"
